<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account, 1440</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#192B51}a:hover{color:#72251F}
button,input{font-family:inherit;font-size:inherit}
.app{background:#ECE4E5;color:#2E1819;font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.5;display:flex;flex-direction:column}
.serif{font-family:'Playfair Display',Georgia,serif}
.muted{color:#6B5557}
.wrap{width:1024px;margin:0 auto}
.logo{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:26px;color:#ECE4E5;text-decoration:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:48px;width:100%;padding:0 20px;border-radius:8px;border:1px solid transparent;font-weight:600;font-size:16px;text-decoration:none;white-space:nowrap;background:transparent;color:#2E1819}
.lbl{font-size:14px;font-weight:600}
.inp{height:46px;width:100%;padding:0 14px;border:1px solid #6F7C93;border-radius:8px;background:#F6F1F1;color:#2E1819;font-size:15px}
.eye{position:absolute;top:3px;right:3px;width:40px;height:40px;border:0;border-radius:6px;background:transparent;color:#6B5557;display:flex;align-items:center;justify-content:center}
.gmark{width:22px;height:22px;border-radius:50%;border:1.5px solid #2E1819;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style>
</head>
<body>
<div class="app" style="width: 1440px; min-height: 1200px">
  <header style="background: #192B51">
    <div class="wrap" style="height: 72px; display: flex; align-items: center"><a href="#" class="logo">my-shelfie</a></div>
  </header>
  <main style="flex: 1; display: flex; justify-content: center; padding: 56px 0 72px">
    <section style="width: 440px; border-radius: 12px; background: #F6F1F1; overflow: hidden; align-self: flex-start; box-shadow: 0 24px 40px -28px rgba(46,24,25,.5)">
      <div aria-hidden="true" style="display: flex; align-items: flex-end; gap: 3px; height: 72px; padding: 0 40px; background: #192B51">
        <div style="width: 14px; height: 40px; border-radius: 2px 2px 0 0; background: #72251F"></div>
        <div style="width: 18px; height: 52px; border-radius: 2px 2px 0 0; background: #E0D1CA"></div>
        <div style="width: 16px; height: 46px; border-radius: 2px 2px 0 0; border: 1.5px dashed #E0D1CA; border-bottom: 0"></div>
      </div>
      <div style="height: 8px; background: #8090A8"></div>
      <div style="padding: 32px 40px 36px; display: flex; flex-direction: column; gap: 20px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <h1 class="serif" style="margin: 0; font-size: 32px; font-weight: 600; line-height: 1.15">Start your shelf</h1>
          <p class="muted" style="margin: 0">Create an account to catalogue your books.</p>
        </div>
        <a href="#" class="btn" style="border-color: #8090A8; background: #F6F1F1"><span class="gmark" aria-hidden="true">G</span>Sign up with Google</a>
        <div aria-hidden="true" style="display: flex; align-items: center; gap: 12px; color: #6B5557; font-size: 13px"><span style="flex: 1; height: 1px; background: #C6D0DD"></span>or with email<span style="flex: 1; height: 1px; background: #C6D0DD"></span></div>
        <form style="display: flex; flex-direction: column; gap: 16px">
          <div style="display: flex; flex-direction: column; gap: 6px"><label for="nm" class="lbl">Name</label><input id="nm" class="inp" autocomplete="name" value="Daryna"></div>
          <div style="display: flex; flex-direction: column; gap: 6px"><label for="em" class="lbl">Email</label><input id="em" class="inp" type="email" autocomplete="email" value="daryna@example.com"></div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <label for="pw" class="lbl">Password</label>
            <div style="position: relative"><input id="pw" class="inp" type="password" autocomplete="new-password" value="bookworm2026" aria-describedby="pwh" style="padding-right: 52px"><button type="button" class="eye" aria-label="Show password"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></div>
            <span id="pwh" class="muted" style="font-size: 13px">At least 8 characters.</span>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <label for="pw2" class="lbl">Confirm password</label>
            <div style="position: relative"><input id="pw2" class="inp" type="password" autocomplete="new-password" value="bookworm2026" style="padding-right: 52px"><button type="button" class="eye" aria-label="Show password"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></div>
          </div>
          <button type="submit" class="btn" style="background: #72251F; color: #F6F1F1; margin-top: 4px">Create account</button>
          <p class="muted" style="margin: 0; font-size: 13px; text-align: center">By creating an account you agree to the <a href="#">privacy notice</a>.</p>
        </form>
        <p class="muted" style="margin: 0; padding-top: 18px; border-top: 1px solid #C6D0DD; text-align: center">Already have an account? <a href="#" style="display: inline-flex; align-items: center; height: 40px; font-weight: 600">Sign in</a></p>
      </div>
    </section>
  </main>
  <footer style="border-top: 1px solid #C6D0DD">
    <div class="wrap" style="min-height: 64px; display: flex; align-items: center; justify-content: space-between; font-size: 14px">
      <span class="muted"><span class="serif" style="font-weight: 600; color: #72251F">my-shelfie</span> · a book-catalogue pet project</span>
      <nav aria-label="Footer" style="display: flex; gap: 8px"><a href="#" style="display: inline-flex; align-items: center; height: 40px; padding: 0 8px">Source on GitHub</a><a href="#" style="display: inline-flex; align-items: center; height: 40px; padding: 0 8px">Privacy</a></nav>
    </div>
  </footer>
</div>
</body>
</html>
