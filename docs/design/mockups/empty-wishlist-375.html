<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empty wishlist, 375</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#192B51}a:hover{color:#72251F}
button{font-family:inherit;font-size:inherit}
.app{position:relative;background:#ECE4E5;color:#2E1819;font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.5;display:flex;flex-direction:column}
.serif{font-family:'Playfair Display',Georgia,serif}
.muted{color:#6B5557}
.logo{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:22px;color:#ECE4E5;text-decoration:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 22px;border-radius:10px;border:1px solid transparent;font-weight:600;font-size:16px;text-decoration:none;white-space:nowrap;background:transparent;color:#2E1819}
.bn{background:#192B51;color:#ECE4E5}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:78px;background:#192B51;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:start;padding:8px 4px 12px}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:56px;color:#C6D0DD;text-decoration:none;font-size:11px;font-weight:500}
.tb.on{color:#ECE4E5;font-weight:700}
.tb.on .ico{background:rgba(198,208,221,.2);border-radius:999px;width:44px;height:26px;padding:3px 12px}
.fab{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:#ECE4E5;font-size:11px;font-weight:600}
.fab .c{width:56px;height:56px;border-radius:50%;background:#72251F;color:#F6F1F1;display:flex;align-items:center;justify-content:center;margin-top:-28px;box-shadow:0 0 0 5px #ECE4E5}
</style>
</head>
<body>
<div class="app" style="width: 375px; height: 900px">
  <header style="background: #192B51; height: 56px; padding: 0 16px; display: flex; align-items: center">
    <a href="#" class="logo">my-shelfie</a>
  </header>
  <main style="padding: 20px 16px 0; display: flex; flex-direction: column; gap: 16px">
    <h1 class="serif" style="margin: 0; font-size: 32px; font-weight: 600; line-height: 1.1">Library</h1>
    <div role="tablist" aria-label="Library sections" style="display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 12px; background: #F6F1F1">
      <button type="button" role="tab" aria-selected="false" style="height: 44px; border: 0; border-radius: 9px; background: transparent; color: #2E1819; font-size: 15px; font-weight: 500">My library · 24</button>
      <button type="button" role="tab" aria-selected="true" style="height: 44px; border: 0; border-radius: 9px; background: #192B51; color: #ECE4E5; font-size: 15px; font-weight: 700">Wishlist · 0</button>
    </div>
    <section style="margin-top: 40px; display: flex; flex-direction: column; align-items: center; text-align: center">
      <div aria-hidden="true" style="width: 96px; height: 96px; border-radius: 50%; background: #C6D0DD; color: #192B51; display: flex; align-items: center; justify-content: center"><svg class="ico" viewBox="0 0 24 24" style="width: 44px; height: 44px; stroke-width: 1.5"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg></div>
      <h2 class="serif" style="margin: 24px 0 8px; font-size: 26px; font-weight: 600">Nothing on your wishlist</h2>
      <p class="muted" style="margin: 0 0 24px; font-size: 15px">Books you want but don’t own yet go here, including the missing parts of your series. They also show up in Next to buy.</p>
      <a href="#" class="btn bn" style="width: 100%"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add a book to wishlist</a>
    </section>
  </main>
  <nav class="tabbar" aria-label="Main">
    <a href="#" class="tb"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h3v16H5zM10 4h3v16h-3zM15.5 5l3 .8-3.6 14-3-.8z"></path></svg>Library</a>
    <a href="#" class="tb on" aria-current="page"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>Wishlist</a>
    <a href="#" class="fab"><span class="c"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width: 26px; height: 26px"><path d="M12 5v14M5 12h14"></path></svg></span>Add</a>
    <a href="#" class="tb"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12l-1 13H7z"></path><path d="M9 7a3 3 0 0 1 6 0"></path></svg>Next to buy</a>
    <a href="#" class="tb"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Account</a>
  </nav>
</div>
</body>
</html>
