<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nothing to buy, 1440</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#192B51}a:hover{color:#72251F}
button{font-family:inherit;font-size:inherit}
.app{background:#ECE4E5;color:#2E1819;font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.5;display:flex;flex-direction:column}
.serif{font-family:'Playfair Display',Georgia,serif}
.muted{color:#6B5557}
.wrap{width:1024px;margin:0 auto}
.nav{background:#192B51}
.logo{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:24px;color:#ECE4E5;text-decoration:none}
.nl{display:inline-flex;align-items:center;height:40px;padding:0 14px;border-radius:8px;color:#C6D0DD;text-decoration:none;font-weight:500}
.nl.on{background:rgba(198,208,221,.18);color:#ECE4E5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:8px;border:1px solid transparent;font-weight:600;font-size:15px;text-decoration:none;white-space:nowrap;background:transparent;color:#2E1819}
.bb{background:#E0D1CA;color:#2E1819}
.bo{border-color:#8090A8;background:#F6F1F1}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style>
</head>
<body>
<div class="app" style="width: 1440px; min-height: 900px">
  <header class="nav">
    <div class="wrap" style="height: 68px; display: flex; align-items: center; gap: 6px">
      <a href="#" class="logo" style="margin-right: 28px">my-shelfie</a>
      <a href="#" class="nl">Library</a>
      <a href="#" class="nl">Wishlist</a>
      <a href="#" class="nl on" aria-current="page">Next to buy</a>
      <a href="#" class="btn bb" style="margin-left: auto; height: 40px; padding: 0 16px"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add a book</a>
      <button type="button" aria-label="Account: Daryna" style="width: 40px; height: 40px; margin-left: 8px; border-radius: 50%; border: 0; background: #8090A8; color: #2E1819; font-weight: 700">D</button>
    </div>
  </header>
  <main class="wrap" style="padding: 40px 0 80px; display: flex; flex-direction: column; gap: 24px">
    <h1 class="serif" style="margin: 0; font-size: 44px; font-weight: 600; line-height: 1.1">Next to buy</h1>
    <section style="display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 56px; align-items: center; padding: 48px; border-radius: 16px; background: #192B51; color: #ECE4E5; margin-top: 16px">
      <div aria-hidden="true" style="display: flex; flex-direction: column">
        <div style="display: flex; align-items: flex-end; gap: 4px; height: 180px; padding: 0 16px">
          <div style="width: 30px; height: 140px; border-radius: 3px; background: #72251F"></div>
          <div style="width: 36px; height: 176px; border-radius: 3px; background: #E0D1CA"></div>
          <div style="width: 26px; height: 122px; border-radius: 3px; background: #8090A8"></div>
          <div style="width: 34px; height: 158px; border-radius: 3px; background: #C6D0DD"></div>
          <div style="width: 30px; height: 166px; border-radius: 3px; background: #72251F"></div>
          <div style="width: 40px; height: 134px; border-radius: 3px; background: #ECE4E5"></div>
          <div style="width: 28px; height: 150px; border-radius: 3px; background: #8090A8"></div>
        </div>
        <div style="height: 12px; border-radius: 3px; background: #8090A8"></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px">
        <h2 class="serif" style="margin: 0; font-size: 36px; font-weight: 600; line-height: 1.15">Every shelf is complete</h2>
        <p style="margin: 0; font-size: 17px; color: #C6D0DD; max-width: 460px">You own every book in the series you collect, and your wishlist is empty. Add a wanted book, or come back when a new one is out.</p>
        <div style="display: flex; gap: 10px; margin-top: 12px">
          <a href="#" class="btn bb"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add to wishlist</a>
          <a href="#" class="btn" style="color: #ECE4E5; border-color: rgba(198,208,221,.5)">Open library</a>
        </div>
      </div>
    </section>
  </main>
</div>
</body>
</html>
